<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>유축기 출고 스캔 (PWA)</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#111827" />
  <style>
    :root { color-scheme: light dark; }
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Apple SD Gothic Neo,Noto Sans KR;margin:0;padding:16px;background:#fff;color:#111827}
    header{font-weight:800;font-size:22px;margin:4px 0 12px}
    .card{border:1px solid #e5e7eb;border-radius:12px;padding:16px}
    button{padding:12px 16px;border-radius:12px;border:0;background:#111827;color:#fff;font-weight:700}
    video,canvas{width:100%;border:1px solid #e5e7eb;border-radius:10px;background:#000}
    #preview,#snapshot{width:100%;aspect-ratio:16/7;object-fit:cover}
      .muted{opacity:.7}
    #hint{display:none!important}  /* 프리뷰/보강 문구 항상 숨김 */
   </style>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>
  <header>유축기 출고 스캔</header>

  <div class="card">
    <video id="preview" autoplay playsinline muted></video>
    <br/><br/>
    <button id="captureBtn">사진 촬영</button>

    <canvas id="snapshot" style="display:none;margin-top:12px;"></canvas>

    <div id="ocrPanel" style="display:none;margin-top:16px;">
      <div style="font-weight:800;margin-bottom:8px;">인식 결과 (확인 후 저장)</div>
      <div style="line-height:1.9">
        출고일: <span id="r_shipDate">-</span><br/>
        대여자명: <span id="r_name">-</span><br/>
        전화번호: <span id="r_phone">-</span><br/>
        주소: <span id="r_addr">-</span><br/>
        기종: <span id="r_model">-</span> / 기기번호: <span id="r_deviceId">-</span>
      </div>
      <button id="confirmBtn" style="margin-top:12px;">확인 (엑셀 저장)</button>
      <div id="hint" class="muted" style="margin-top:8px;font-size:12px;"></div>
    </div>
  </div>

<script>
const APP_VER  = "2025-08-27-accuracy-first";
const API_BASE = ""; // same origin

/* SW 최신화 */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js?ver=' + APP_VER).then(async (reg) => {
    try {
      await reg.update();
      if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
      if (reg.installing) reg.installing.addEventListener('statechange', (e) => {
        if (e.target.state === 'installed') reg.waiting?.postMessage({ type: 'SKIP_WAITING' });
      });
      navigator.serviceWorker.addEventListener('controllerchange', () => { location.reload(); });
    } catch {}
  }).catch(()=>{});
}

/* fetch 유틸: 시간 제한 X (정확도/저장 성공 우선) */
async function fetchNoTimeout(url, options={}){
  return fetch(url, { credentials:'include', cache:'no-store', ...options });
}
function warm(){ fetchNoTimeout(`${API_BASE}/__ping`).catch(()=>{}); }
warm();

/* 요소 */
const video   = document.getElementById('preview');
const canvas  = document.getElementById('snapshot');
const ctx     = canvas.getContext('2d', { willReadFrequently: true });

const r_shipDate = document.getElementById('r_shipDate');
const r_name     = document.getElementById('r_name');
const r_phone    = document.getElementById('r_phone');
const r_addr     = document.getElementById('r_addr');
const r_model    = document.getElementById('r_model');
const r_deviceId = document.getElementById('r_deviceId');
const hint       = document.getElementById('hint');

let __stream = null;
let ocrPreview = null;
let ocrRunning = false;

/* 카메라 */
async function stopCamera(){
  try {
    if (video.srcObject) {
      video.srcObject.getTracks().forEach(t=>t.stop());
      video.srcObject = null;
    }
    if (__stream) {
      __stream.getTracks().forEach(t=>t.stop());
      __stream = null;
    }
  } catch {}
}
async function initCamera(){
  await stopCamera();
  try {
    __stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ exact:'environment' }}, audio:false });
  } catch {
    try {
      __stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' }}, audio:false });
    } catch {
      __stream = await navigator.mediaDevices.getUserMedia({ video:true, audio:false });
    }
  }
  video.srcObject = __stream;
  await video.play().catch(()=>{});
}

/* 라이프사이클 */
window.addEventListener('pageshow', (e) => { if (e.persisted || !video.srcObject) initCamera(); });
window.addEventListener('pagehide', () => { stopCamera(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) stopCamera(); else initCamera(); });
window.addEventListener('beforeunload', () => { stopCamera(); });

/* 유틸 */
function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }
function parseModelDevice(raw) {
  const original = (raw || '').toString().trim();
  const u = original.toUpperCase().replace(/[^A-Z0-9]/g,'');
  const MAP = { SM:'심포니', LT:'락티나', S:'스윙', M:'스윙맥스', F:'프리스타일', G:'각시밀', C:'시밀레' };
  const m2 = u.match(/^(SM|LT)(\d{2,})$/);
  if (m2) return { model: MAP[m2[1]] || '-', deviceId: m2[2], raw: original };
  const m1 = u.match(/^([SMFLGC])[A-Z0-9]*$/);
  if (m1)  return { model: MAP[m1[1]] || '-', deviceId: original, raw: original };
  return { model: '-', deviceId: '-', raw: original };
}
function populatePanel(d){
  document.getElementById('ocrPanel').style.display = 'block';
  r_shipDate.textContent = d['출고일']   || '-';
  r_name.textContent     = d['대여자명'] || '-';
  r_phone.textContent    = d['전화번호'] || '-';
  r_addr.textContent     = d['주소']     || '-';
  r_model.textContent    = d['기종']     || '-';
  r_deviceId.textContent = d['기기번호'] || '-';
}
function scanQRFromCanvas() {
  try {
    const img = ctx.getImageData(0,0,canvas.width,canvas.height);
    const code = jsQR(img.data, img.width, img.height, { inversionAttempts:'attemptBoth' });
    return code ? { text: code.data, loc: code.location } : { text:'', loc:null };
  } catch { return { text:'', loc:null }; }
}
function drawBadge(text, x=16, y=12){
  if (!text) return;
  const pad = 12;
  ctx.font = 'bold 26px system-ui,-apple-system,Segoe UI,Roboto';
  const w = ctx.measureText(text).width + pad * 2;
  const h = 40;
  x = clamp(x, 8, canvas.width - w - 8);
  y = clamp(y, 8, canvas.height - h - 8);
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#fff';
  ctx.fillText(text, x + pad * 0.6, y + 28);
}
function canvasToBlobResized(fromCanvas, cb) {
  // 정확도 위해 과도한 축소 없음 (최대 1600px)
  const maxW = 1600;
  const scale = Math.min(1, maxW / fromCanvas.width);
  if (scale < 1) {
    const tmp = document.createElement('canvas');
    tmp.width = Math.round(fromCanvas.width * scale);
    tmp.height = Math.round(fromCanvas.height * scale);
    tmp.getContext('2d', { willReadFrequently: true }).drawImage(fromCanvas, 0, 0, tmp.width, tmp.height);
    tmp.toBlob(cb, 'image/jpeg', 0.85);
  } else {
    fromCanvas.toBlob(cb, 'image/jpeg', 0.85);
  }
}

/* 초기 카메라 */
initCamera();

/* 촬영 */
document.getElementById('captureBtn').addEventListener('click', () => {
  const w = video.videoWidth, h = video.videoHeight;
  if (!w || !h) return alert('카메라 초기화 대기 후 다시 시도');

  canvas.width = w; canvas.height = h;
  ctx.drawImage(video, 0, 0, w, h);
  canvas.style.display = 'block';

  // QR → 기종/기기번호 배지
  const { text:qr, loc } = scanQRFromCanvas();
  const md = parseModelDevice(qr);
  const label = `${md.model} / ${md.deviceId}`;
  let x = 16, y = 12;
  if (loc && loc.topLeftCorner) {
    x = Math.max(16, loc.topLeftCorner.x - 8);
    y = Math.max(12, loc.topLeftCorner.y - 48);
  }
  drawBadge(label, x, y);

  // 초기값 표시
  ocrPreview = {
    "출고일":  new Date().toISOString().slice(0,10),
    "대여자명": "-",
    "전화번호": "-",
    "주소": "-",
    "기기번호": md.deviceId || "-",
    "기종": md.model || "-"
  };
  populatePanel(ocrPreview);
  hint.textContent = "프리뷰 인식 중... (정확도 우선)";

  if (ocrRunning) return;
  ocrRunning = true;

  canvasToBlobResized(canvas, async (blob) => {
    const fdPrev = new FormData();
    fdPrev.append('image', blob, 'p.jpg');
    fdPrev.append('qr_text', qr || '');

    // 프리뷰 — 시간 제한 없이 정확도 우선
    try {
      const rPrev = await fetchNoTimeout(`${API_BASE}/preview-ocr`, { method:'POST', body: fdPrev });
      if (rPrev.ok) {
        const j = await rPrev.json().catch(()=>null);
        if (j && j.data) {
          const d = j.data;
          ocrPreview = {
            "출고일":  d['출고일']   || ocrPreview['출고일'],
            "대여자명": d['대여자명'] || ocrPreview['대여자명'],
            "전화번호": d['전화번호'] || ocrPreview['전화번호'],
            "주소":     d['주소']     || ocrPreview['주소'],
            "기기번호": ocrPreview['기기번호'],
            "기종":     ocrPreview['기종'],
          };
          populatePanel(ocrPreview);
          hint.textContent = "정식 OCR 보강 중... (정확도 우선)";
        } else {
          hint.textContent = "프리뷰 응답 형식 오류";
        }
      } else {
        const txt = await rPrev.text().catch(()=>rPrev.statusText);
        hint.textContent = `프리뷰 실패: ${rPrev.status} ${txt}`;
      }
    } catch(e){
      hint.textContent = `프리뷰 네트워크 오류: ${e.message||e}`;
    }

    // 정식 보강 — 시간 제한 없이 정확도 우선
    const fdFull = new FormData();
    fdFull.append('image', blob, 'f.jpg');
    fdFull.append('qr_text', qr || '');
    try {
      const rFull = await fetchNoTimeout(`${API_BASE}/process-ocr/`, { method:'POST', body: fdFull });
      if (rFull.ok) {
        const j = await rFull.json().catch(()=>null);
        const d = (j && j.data) || null;
        if (d) {
          ocrPreview = {
            "출고일":  d['출고일']   || ocrPreview['출고일'],
            "대여자명": d['대여자명'] || ocrPreview['대여자명'],
            "전화번호": d['전화번호'] || ocrPreview['전화번호'],
            "주소":     d['주소']     || ocrPreview['주소'],
            "기기번호": ocrPreview['기기번호'],
            "기종":     ocrPreview['기종'],
          };
          populatePanel(ocrPreview);
          hint.textContent = "";
        } else {
          const txt = await rFull.text().catch(()=>rFull.statusText);
          hint.textContent = `정식 OCR 결과 없음: ${txt}`;
        }
      } else {
        const txt = await rFull.text().catch(()=>rFull.statusText);
        hint.textContent = `정식 OCR 실패: ${rFull.status} ${txt}`;
      }
    } catch(e){
      hint.textContent = `정식 OCR 네트워크 오류: ${e.message||e}`;
    } finally {
      ocrRunning = false;
    }
  });
});

/* 확인(엑셀 저장) — 동기 저장 (성공/실패 확정) */
document.getElementById('confirmBtn').addEventListener('click', async () => {
  if (!ocrPreview) return alert('인식 결과가 없습니다. 먼저 촬영하세요.');
  const btn = document.getElementById('confirmBtn');
  btn.disabled = true;

  try{
    const res = await fetchNoTimeout(`${API_BASE}/save-result`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(ocrPreview),
    });

    let api = {}; try { api = await res.clone().json(); } catch {}

    if (res.status === 401 || (api?.write_error && api.write_error.error === 'no_access_token')){
      alert('엑셀 저장을 위해 로그인이 필요합니다. /login을 먼저 수행해 주세요.');
      location.href = `${API_BASE}/login`;
      return;
    }

    if (res.ok && api.status === 'success'){
      alert('엑셀 저장 완료');
    } else {
      const txt = await res.text().catch(()=>res.statusText);
      alert('저장 실패: ' + (txt || res.statusText));
    }
  } catch(e){
    alert('서버 전송 실패: ' + e.message);
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
