<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>유축기 출고 스캔 (PWA)</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#111827" />
  <style>
    :root { color-scheme: light dark; }
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Apple SD Gothic Neo,Noto Sans KR;margin:0;padding:16px;background:#fff;color:#111827}
    header{font-weight:800;font-size:22px;margin:4px 0 12px}
    .card{border:1px solid #e5e7eb;border-radius:12px;padding:16px}
    button{padding:12px 16px;border-radius:12px;border:0;background:#111827;color:#fff;font-weight:700}
    video,canvas{width:100%;border:1px solid #e5e7eb;border-radius:10px;background:#000}
    #preview,#snapshot{width:100%;aspect-ratio:16/7;object-fit:cover}
    .muted{opacity:.7}
    #hint{display:none!important}
    /* 탭 십자표시(+) */
    #tapCross{position:fixed;width:22px;height:22px;pointer-events:none;z-index:3;display:none}
    #tapCross::before,#tapCross::after{content:"";position:absolute;background:#10b981}
    #tapCross::before{left:10px;top:0;width:2px;height:22px;border-radius:1px}
    #tapCross::after{left:0;top:10px;width:22px;height:2px;border-radius:1px}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>
  <header>유축기 출고 스캔</header>

  <div class="card">
    <video id="preview" autoplay playsinline muted></video>
    <div class="muted" style="font-size:12px;margin-top:6px">
      노란 라벨의 <b>대여자명 첫 글자</b> 위를 <b>탭하면 즉시 촬영</b>합니다. (버스트 3장)
    </div>

    <canvas id="snapshot" style="display:none;margin-top:12px;"></canvas>

    <div id="ocrPanel" style="display:none;margin-top:16px;">
      <div style="font-weight:800;margin-bottom:8px;">인식 결과 (확인 후 저장)</div>
      <div style="line-height:1.9">
        출고일: <span id="r_shipDate">-</span><br/>
        대여자명: <span id="r_name">-</span><br/>
        전화번호: <span id="r_phone">-</span><br/>
        주소: <span id="r_addr">-</span><br/>
        기종: <span id="r_model">-</span> / 기기번호: <span id="r_deviceId">-</span>
      </div>
      <button id="confirmBtn" style="margin-top:12px;">확인 (엑셀 저장)</button>
      <div id="hint" class="muted" style="margin-top:8px;font-size:12px;"></div>
    </div>
  </div>

  <div id="tapCross"></div>

<script>
const APP_VER  = "2025-08-28-burst3-plus";
const API_BASE = ""; // 같은 오리진

/* SW 강제 최신화 */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js?ver=' + APP_VER).then(async (reg) => {
    try {
      await reg.update();
      if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
      if (reg.installing) reg.installing.addEventListener('statechange', (e) => {
        if (e.target.state === 'installed') reg.waiting?.postMessage({ type: 'SKIP_WAITING' });
      });
      navigator.serviceWorker.addEventListener('controllerchange', () => { location.reload(); });
    } catch {}
  }).catch(()=>{});
}

/* fetch 유틸 */
async function fetchWithTimeout(url, {timeoutMs=30000, retry=0, ...options}={}) {
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(url, { signal: ctrl.signal, credentials:'include', cache:'no-store', ...options });
    return res;
  } catch (e) {
    if (retry > 0) return fetchWithTimeout(url, {timeoutMs, retry: retry-1, ...options});
    throw e;
  } finally { clearTimeout(t); }
}
fetchWithTimeout(`${API_BASE}/__ping`, {timeoutMs:5000}).catch(()=>{});

/* 요소 */
const video   = document.getElementById('preview');
const canvas  = document.getElementById('snapshot');
const ctx     = canvas.getContext('2d', { willReadFrequently: true });

const r_shipDate = document.getElementById('r_shipDate');
const r_name     = document.getElementById('r_name');
const r_phone    = document.getElementById('r_phone');
const r_addr     = document.getElementById('r_addr');
const r_model    = document.getElementById('r_model');
const r_deviceId = document.getElementById('r_deviceId');

const tapCross = document.getElementById('tapCross');

let __stream = null;
let ocrPreview = null;
let ocrRunning = false;
let anchorNorm = null; // {x:0..1, y:0..1}

/* 카메라 */
async function stopCamera(){
  try {
    if (video.srcObject) {
      video.srcObject.getTracks().forEach(t=>t.stop());
      video.srcObject = null;
    }
    if (__stream) { __stream.getTracks().forEach(t=>t.stop()); __stream = null; }
  } catch {}
}
async function initCamera(){
  await stopCamera();
  try {
    __stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ exact:'environment' }}, audio:false });
  } catch {
    try { __stream = await navigator.mediaDevices.getUserMedia({ video:{ ideal:'environment' }, audio:false }); }
    catch { __stream = await navigator.mediaDevices.getUserMedia({ video:true, audio:false }); }
  }
  video.srcObject = __stream;
  await video.play().catch(()=>{});
}
window.addEventListener('pageshow', (e) => { if (e.persisted || !video.srcObject) initCamera(); });
window.addEventListener('pagehide', () => { stopCamera(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) stopCamera(); else initCamera(); });
window.addEventListener('beforeunload', () => { stopCamera(); });

/* 유틸 */
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function parseModelDevice(raw){
  const original = (raw || '').toString().trim();
  const u = original.toUpperCase().replace(/[^A-Z0-9]/g,'');
  const MAP = { SM:'심포니', LT:'락티나', S:'스윙', M:'스윙맥스', F:'프리스타일', G:'각시밀', C:'시밀레' };
  const m2 = u.match(/^(SM|LT)(\d{2,})$/);
  if (m2) return { model: MAP[m2[1]] || '-', deviceId: m2[2], raw: original };
  const m1 = u.match(/^([SMFLGC])[A-Z0-9]*$/);
  if (m1)  return { model: MAP[m1[1]] || '-', deviceId: original, raw: original };
  return { model: '-', deviceId: '-', raw: original };
}
function populatePanel(d){
  document.getElementById('ocrPanel').style.display = 'block';
  r_shipDate.textContent = d['출고일']   || '-';
  r_name.textContent     = d['대여자명'] || '-';
  r_phone.textContent    = d['전화번호'] || '-';
  r_addr.textContent     = d['주소']     || '-';
  r_model.textContent    = d['기종']     || '-';
  r_deviceId.textContent = d['기기번호'] || '-';
}
function drawBadge(text, x=16, y=12){
  if (!text) return;
  const pad = 12;
  ctx.font = 'bold 26px system-ui,-apple-system,Segoe UI,Roboto';
  const w = ctx.measureText(text).width + pad * 2;
  const h = 40;
  x = clamp(x, 8, canvas.width - w - 8);
  y = clamp(y, 8, canvas.height - h - 8);
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#fff';
  ctx.fillText(text, x + pad * 0.6, y + 28);
}

/* 라플라시안 샤프니스 추정 (간이) */
function estimateSharpness(cnv){
  const sctx = cnv.getContext('2d', { willReadFrequently:true });
  const w = cnv.width, h = cnv.height;
  // 다운스케일로 비용 절감
  const dw = Math.max(160, Math.floor(w/6)), dh = Math.max(90, Math.floor(h/6));
  const tmp = document.createElement('canvas');
  tmp.width = dw; tmp.height = dh;
  tmp.getContext('2d', { willReadFrequently:true }).drawImage(cnv, 0, 0, dw, dh);
  const dctx = tmp.getContext('2d', { willReadFrequently:true });
  const { data } = dctx.getImageData(0,0,dw,dh);
  // 그레이 변환
  const gray = new Float32Array(dw*dh);
  for (let i=0, j=0; i<data.length; i+=4, j++){
    gray[j] = 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2];
  }
  // 라플라시안 필터 3x3
  const kernel = [-1,-1,-1,-1,8,-1,-1,-1,-1];
  const resp = new Float32Array(dw*dh);
  for (let y=1; y<dh-1; y++){
    for (let x=1; x<dw-1; x++){
      let sum = 0, idx = 0;
      for (let ky=-1; ky<=1; ky++){
        for (let kx=-1; kx<=1; kx++){
          sum += gray[(y+ky)*dw + (x+kx)] * kernel[idx++];
        }
      }
      resp[y*dw+x] = sum;
    }
  }
  // 분산
  let mean=0, n=resp.length, acc=0;
  for (let i=0;i<n;i++) mean += resp[i];
  mean/=n;
  for (let i=0;i<n;i++){ const d=resp[i]-mean; acc += d*d; }
  return acc/n;
}

function canvasToBlobResized(fromCanvas, cb) {
  const maxW = 1100;
  const scale = Math.min(1, maxW / fromCanvas.width);
  if (scale < 1) {
    const tmp = document.createElement('canvas');
    tmp.width = Math.round(fromCanvas.width * scale);
    tmp.height = Math.round(fromCanvas.height * scale);
    tmp.getContext('2d', { willReadFrequently: true }).drawImage(fromCanvas, 0, 0, tmp.width, tmp.height);
    tmp.toBlob(cb, 'image/jpeg', 0.6);
  } else {
    fromCanvas.toBlob(cb, 'image/jpeg', 0.6);
  }
}

/* 좌표 변환 & 탭 표시 */
function clamp01(v){ return Math.max(0, Math.min(1, v)); }
function mapClickToVideoFrame(ev){
  const rect = video.getBoundingClientRect();
  const cx = ev.clientX - rect.left;
  const cy = ev.clientY - rect.top;
  const vw = video.videoWidth || rect.width;
  const vh = video.videoHeight || rect.height;
  const s = Math.max(rect.width / vw, rect.height / vh);
  const dispW = vw * s, dispH = vh * s;
  const offX = (dispW - rect.width)/2;
  const offY = (dispH - rect.height)/2;
  const sx = (cx + offX) / s;
  const sy = (cy + offY) / s;
  const ax = clamp01(sx / vw), ay = clamp01(sy / vh);
  return { ax, ay, client:{x:ev.clientX, y:ev.clientY} };
}
function showCross(pt){
  tapCross.style.left = (pt.x-11) + 'px';
  tapCross.style.top  = (pt.y-11) + 'px';
  tapCross.style.display = 'block';
  setTimeout(()=>{ tapCross.style.display='none'; }, 800);
}

/* 탭 → 버스트 3장 촬영 → 최고 선명 프레임으로 OCR */
video.addEventListener('click', async (ev) => {
  const m = mapClickToVideoFrame(ev);
  anchorNorm = { x: m.ax, y: m.ay };
  showCross(m.client);

  const w = video.videoWidth, h = video.videoHeight;
  if (!w || !h) { alert('카메라 초기화 대기 후 다시 시도'); return; }

  // 버스트 캡쳐(3장)
  const frames = [];
  for (let i=0;i<3;i++){
    const cnv = document.createElement('canvas');
    cnv.width = w; cnv.height = h;
    cnv.getContext('2d', { willReadFrequently:true }).drawImage(video, 0, 0, w, h);
    frames.push(cnv);
    // 120ms 간격
    // eslint-disable-next-line no-await-in-loop
    await new Promise(r=>setTimeout(r, 120));
  }
  // sharpest 선택
  let best = frames[0], bestScore = -1;
  for (const f of frames){
    const s = estimateSharpness(f);
    if (s > bestScore){ bestScore = s; best = f; }
  }

  // 미리보기에 그리기(여기에만 QR 배지)
  canvas.width = w; canvas.height = h;
  ctx.drawImage(best, 0, 0, w, h);
  canvas.style.display = 'block';

  // QR 배지
  try{
    const img = ctx.getImageData(0,0,canvas.width,canvas.height);
    const code = jsQR(img.data, img.width, img.height, { inversionAttempts:'attemptBoth' });
    let qr = "", loc=null;
    if (code) { qr = code.data; loc = code.location; }
    const md = (function(raw){
      const original = (raw || '').toString().trim();
      const u = original.toUpperCase().replace(/[^A-Z0-9]/g,'');
      const MAP = { SM:'심포니', LT:'락티나', S:'스윙', M:'스윙맥스', F:'프리스타일', G:'각시밀', C:'시밀레' };
      const m2 = u.match(/^(SM|LT)(\d{2,})$/);
      if (m2) return { model: MAP[m2[1]] || '-', deviceId: m2[2], raw: original };
      const m1 = u.match(/^([SMFLGC])[A-Z0-9]*$/);
      if (m1)  return { model: MAP[m1[1]] || '-', deviceId: original, raw: original };
      return { model: '-', deviceId: '-', raw: original };
    })(qr);
    const label = `${md.model} / ${md.deviceId}`;
    let bx = 16, by = 12;
    if (loc && loc.topLeftCorner) { bx = Math.max(16, loc.topLeftCorner.x - 8); by = Math.max(12, loc.topLeftCorner.y - 48); }
    // 배지
    const pad = 12;
    ctx.font = 'bold 26px system-ui,-apple-system,Segoe UI,Roboto';
    const wtxt = ctx.measureText(label).width + pad * 2;
    const htxt = 40;
    bx = Math.max(8, Math.min(canvas.width - wtxt - 8, bx));
    by = Math.max(8, Math.min(canvas.height - htxt - 8, by));
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(bx, by, wtxt, htxt);
    ctx.fillStyle = '#fff';
    ctx.fillText(label, bx + pad * 0.6, by + 28);

    // 기본값 즉시 표시
    ocrPreview = {
      "출고일":  new Date().toISOString().slice(0,10),
      "대여자명": "-",
      "전화번호": "-",
      "주소": "-",
      "기기번호": md.deviceId || "-",
      "기종": md.model || "-"
    };
    populatePanel(ocrPreview);

    // 서버 전송(덧그림 없는 원본 프레임 사용: best)
    if (ocrRunning) return;
    ocrRunning = true;

    canvasToBlobResized(best, async (blob) => {
      const fd = new FormData();
      fd.append('image', blob, 'f.jpg');
      fd.append('qr_text', qr || '');
      if (anchorNorm){
        fd.append('anchor_x', String(anchorNorm.x));
        fd.append('anchor_y', String(anchorNorm.y));
      }
      try {
        const r = await fetchWithTimeout(`${API_BASE}/process-ocr/`, { method:'POST', body: fd, timeoutMs:45000 });
        if (!r.ok) { const msg = await r.text().catch(()=>r.statusText); alert('인식 실패: ' + msg); return; }
        const j = await r.json().catch(()=>null);
        if (!j || !j.data) { alert('인식 실패: 결과가 비어 있습니다.'); return; }
        const d = j.data;
        ocrPreview = {
          ...ocrPreview,
          "출고일":  d['출고일']   || ocrPreview['출고일'],
          "대여자명": d['대여자명'] || "-",
          "전화번호": d['전화번호'] || "-",
          "주소":     d['주소']     || "-",
        };
        populatePanel(ocrPreview);
      } catch(e){
        alert('인식 네트워크 오류: ' + (e?.message || e));
      } finally {
        ocrRunning = false;
      }
    });
  }catch(e){
    alert('프레임 처리 오류: ' + (e?.message || e));
  }
});

/* 확인(엑셀 저장 + 사진저장) */
document.getElementById('confirmBtn').addEventListener('click', async () => {
  if (!ocrPreview) return alert('인식 결과가 없습니다. 먼저 촬영하세요.');
  const btn = document.getElementById('confirmBtn');
  btn.disabled = true;

  const ts = new Date().toISOString().replace(/[:.TZ]/g,'').slice(0,14);
  canvas.toBlob((b)=>{ 
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = `scan_${ts}.jpg`;
    a.click();
  }, 'image/jpeg', 0.7);

  try{
    const res = await fetchWithTimeout(`${API_BASE}/save-result`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(ocrPreview),
      timeoutMs: 30000
    });
    let txt = ""; try { txt = await res.clone().text(); } catch {}
    let api = {}; try { api = JSON.parse(txt); } catch {}
    if (res.status === 401 || (api?.write_error && api.write_error.error === 'no_access_token')){
      alert('엑셀 저장을 위해 로그인이 필요합니다. 한 번만 진행하면 됩니다.');
      location.href = `${API_BASE}/login`;
      return;
    }
    if (res.ok && api.status === 'success'){ alert('엑셀 저장 완료'); }
    else { alert('저장 실패: ' + (txt || res.statusText)); }
  } catch(e){ alert('서버 전송 실패: ' + e.message); }
  finally { btn.disabled = false; }
});
</script>
</body>
</html>
