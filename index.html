<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>유축기 출고 스캔 (PWA)</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#111827" />
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Apple SD Gothic Neo,Noto Sans KR;
      margin:0; padding:16px; background:#fff; color:#111827;
    }
    header { font-weight:800; font-size:22px; margin:4px 0 12px; }
    .card { border:1px solid #e5e7eb; border-radius:12px; padding:16px; }
    button { padding:12px 16px; border-radius:12px; border:0; background:#111827; color:#fff; font-weight:700; }
    .subbtn { background:#334155; margin:8px 0 16px; }
    video, canvas { width:100%; border:1px solid #e5e7eb; border-radius:10px; background:#000; }
    #preview, #snapshot { width:100%; aspect-ratio:16/7; object-fit:cover; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>
  <header>유축기 출고 스캔 (PWA)</header>

  <!-- 필요 시 수동 로그인 -->
  <button id="loginBtn" class="subbtn">로그인(OneDrive 연동)</button>

  <div class="card">
    <p style="font-weight:700;font-size:20px;margin:0 0 10px;">카메라 테스트</p>
    <video id="preview" autoplay playsinline muted></video>
    <br/><br/>
    <button id="captureBtn">사진 촬영</button>

    <!-- 화면 표시용 캔버스(배지 오버레이 OK) -->
    <canvas id="snapshot" style="display:none;margin-top:12px;"></canvas>
    <!-- OCR 전용 깨끗한 캔버스(절대 배지 X) -->
    <canvas id="ocrSrc" style="display:none;"></canvas>

    <div id="ocrPanel" style="display:none;margin-top:16px;">
      <div style="font-weight:800;margin-bottom:8px;">인식 결과 (확인 후 저장)</div>
      <div style="line-height:1.9">
        출고일: <span id="r_shipDate">-</span><br/>
        대여자명: <span id="r_name">-</span> / 전화: <span id="r_phone">-</span><br/>
        주소: <span id="r_addr">-</span><br/>
        기종: <span id="r_model">-</span> / 기기번호: <span id="r_deviceId">-</span><br/>
        송장번호: <span id="r_invoice">-</span>
      </div>
      <button id="confirmBtn" style="margin-top:12px;">확인 (엑셀 저장)</button>
    </div>
  </div>

<script>
/* ===== 상수 ===== */
const APP_VER  = "2025-08-26-06";
const API_BASE = "https://rent-label-api-client-docker.onrender.com";

/* ===== 서비스워커: 강제 최신화 ===== */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js?ver=' + APP_VER).then(async (reg) => {
    try {
      await reg.update();
      if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
      if (reg.installing) {
        reg.installing.addEventListener('statechange', (e) => {
          if (e.target.state === 'installed') reg.waiting?.postMessage({ type: 'SKIP_WAITING' });
        });
      }
      navigator.serviceWorker.addEventListener('controllerchange', () => { location.reload(); });
    } catch (e) { console.log('SW update error', e); }
  }).catch(()=>{});
}

/* ===== 요소 ===== */
const loginBtn = document.getElementById('loginBtn');
const video   = document.getElementById('preview');
const viewCvs = document.getElementById('snapshot');         // 화면용(배지 OK)
const viewCtx = viewCvs.getContext('2d', { willReadFrequently: true });
const ocrCvs  = document.getElementById('ocrSrc');           // OCR용(배지 X)
const ocrCtx  = ocrCvs.getContext('2d', { willReadFrequently: true });

const r_shipDate = document.getElementById('r_shipDate');
const r_name     = document.getElementById('r_name');
const r_phone    = document.getElementById('r_phone');
const r_addr     = document.getElementById('r_addr');
const r_model    = document.getElementById('r_model');
const r_deviceId = document.getElementById('r_deviceId');
const r_invoice  = document.getElementById('r_invoice');

let badgeText = '';
let badgePos  = { x: 24, y: 24 };
let ocrPreview = null;
let ocrRunning = false;

/* ===== 로그인 ===== */
loginBtn.addEventListener('click', () => {
  window.location.href = `${API_BASE}/login`;
});

/* ===== 카메라 ===== */
(async () => {
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ exact:'environment' }}, audio:false });
    video.srcObject = s; await video.play(); return;
  } catch {}
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' }}, audio:false });
    video.srcObject = s; await video.play(); return;
  } catch {}
  const s = await navigator.mediaDevices.getUserMedia({ video:true, audio:false });
  video.srcObject = s; await video.play();
})();

/* ===== 유틸 ===== */
function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }
function parseModelDevice(raw) {
  const original = (raw || '').toString().trim();
  const u = original.toUpperCase().replace(/[^A-Z0-9]/g,'');
  const MAP = { SM:'심포니', LT:'락티나', S:'스윙', M:'스윙맥스', F:'프리스타일', G:'각시밀', C:'시밀레' };
  const m2 = u.match(/^(SM|LT)(\d{2,})$/);
  if (m2) return { model: MAP[m2[1]] || '-', deviceId: m2[2], raw: original };
  const m1 = u.match(/^([SMFLGC])[A-Z0-9]*$/);
  if (m1)  return { model: MAP[m1[1]] || '-', deviceId: original, raw: original };
  return { model: '-', deviceId: '-', raw: original };
}
function drawBadge(text, x = 24, y = 24) {
  if (!text) return;
  const pad = 12;
  viewCtx.font = 'bold 26px system-ui,-apple-system,Segoe UI,Roboto';
  const w = viewCtx.measureText(text).width + pad * 2;
  const h = 40;
  x = clamp(x, 8, viewCvs.width - w - 8);
  y = clamp(y, 8, viewCvs.height - h - 8);
  viewCtx.fillStyle = 'rgba(0,0,0,0.65)';
  viewCtx.fillRect(x, y, w, h);
  viewCtx.fillStyle = '#fff';
  viewCtx.fillText(text, x + pad * 0.6, y + 28);
}
function populatePanel(d) {
  document.getElementById('ocrPanel').style.display = 'block';
  r_shipDate.textContent = d.shipDate || '-';
  r_name.textContent     = d.name     || '-';
  r_phone.textContent    = d.phone    || '-';
  r_addr.textContent     = d.addr     || '-';
  r_model.textContent    = d.model    || '-';
  r_deviceId.textContent = d.deviceId || '-';
  r_invoice.textContent  = d.invoice  || '-';
}
function canvasToBlobResized(fromCanvas, cb) {
  const maxW = 1400;                                // 해상도 상향
  const scale = Math.min(1, maxW / fromCanvas.width);
  if (scale < 1) {
    const tmp = document.createElement('canvas');
    tmp.width = Math.round(fromCanvas.width * scale);
    tmp.height = Math.round(fromCanvas.height * scale);
    tmp.getContext('2d', { willReadFrequently: true })
       .drawImage(fromCanvas, 0, 0, tmp.width, tmp.height);
    tmp.toBlob(cb, 'image/jpeg', 0.75);             // 품질 상향
  } else {
    fromCanvas.toBlob(cb, 'image/jpeg', 0.75);
  }
}
function downloadCanvas(filename){
  viewCvs.toBlob((blob)=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  },'image/jpeg',0.9);
}

/* ===== 촬영 ===== */
document.getElementById('captureBtn').addEventListener('click', () => {
  const w = video.videoWidth, h = video.videoHeight;
  if (!w || !h) return alert('카메라 초기화 대기 후 다시 시도');

  // 1) 두 캔버스에 원본 프레임 복제
  viewCvs.width = ocrCvs.width = w;
  viewCvs.height = ocrCvs.height = h;
  viewCtx.drawImage(video, 0, 0, w, h);
  ocrCtx.drawImage(video, 0, 0, w, h);
  viewCvs.style.display = 'block';

  // 2) 기본 결과
  const base = {
    shipDate: new Date().toISOString().slice(0,10),
    name:'-', phone:'-', addr:'-', model:'-', deviceId:'-', invoice:'-'
  };

  // 3) QR → 배지는 화면용에만
  let qrText = '';
  try {
    const img = viewCtx.getImageData(0,0,viewCvs.width,viewCvs.height);
    const code = jsQR(img.data, img.width, img.height, { inversionAttempts:'attemptBoth' });
    if (code && code.data) {
      qrText = code.data;
      const md = parseModelDevice(code.data);
      base.model = md.model; base.deviceId = md.deviceId;
      badgeText = `${base.model} / ${base.deviceId}`;
      drawBadge(badgeText, badgePos.x, badgePos.y);
    } else {
      badgeText = ''; badgePos = {x:24,y:24};
    }
  } catch(e){ console.log('QR fail', e); }

  populatePanel(base);

  // 4) OCR 호출은 ‘ocrCvs(배지 없음)’로
  if (ocrRunning) return;
  ocrRunning = true;

  canvasToBlobResized(ocrCvs, async (blob) => {
    // 프리뷰
    try {
      const fd1 = new FormData();
      fd1.append('image', blob, 'capture.jpg');
      fd1.append('qr_text', qrText || '');
      fd1.append('dry', 1);
      const r1 = await fetch(`${API_BASE}/process-ocr/`, { method:'POST', body:fd1 });
      const a1 = await r1.json();
      const d1 = a1.data || {};
      const merged1 = {
        shipDate: d1['출고일']   || base.shipDate,
        name:     d1['대여자명'] || base.name,
        phone:    d1['전화번호'] || base.phone,
        addr:     d1['주소']     || base.addr,
        deviceId: d1['기기번호'] || base.deviceId,
        model:    d1['기종']     || base.model,
        invoice:  d1['송장번호'] || base.invoice
      };
      ocrPreview = merged1;
      populatePanel(merged1);
    } catch (e) {
      console.log('프리뷰 실패', e);
      ocrPreview = base; populatePanel(base);
    }

    // 정식OCR(쓰기 없이) 덮어쓰기
    try {
      const fd2 = new FormData();
      fd2.append('image', blob, 'review.jpg');
      fd2.append('qr_text', qrText || '');
      fd2.append('no_write', 1);
      const r2 = await fetch(`${API_BASE}/process-ocr/`, { method:'POST', body:fd2 });
      const a2 = await r2.json();
      if (r2.ok && (a2.status === 'review' || a2.status === 'success')) {
        const d2 = a2.data || {};
        const merged2 = {
          shipDate: d2['출고일']   || ocrPreview.shipDate,
          name:     d2['대여자명'] || ocrPreview.name,
          phone:    d2['전화번호'] || ocrPreview.phone,
          addr:     d2['주소']     || ocrPreview.addr,
          deviceId: d2['기기번호'] || ocrPreview.deviceId,
          model:    d2['기종']     || ocrPreview.model,
          invoice:  d2['송장번호'] || ocrPreview.invoice
        };
        ocrPreview = merged2;
        populatePanel(merged2);
      }
    } catch (e) {
      console.log('정식OCR 실패', e);
    } finally {
      ocrRunning = false;
    }
  });
});

/* ===== 확인(엑셀 저장) ===== */
document.getElementById('confirmBtn').addEventListener('click', async () => {
  if (!ocrPreview) return alert('인식 결과가 없습니다. 먼저 촬영하세요.');
  const btn = document.getElementById('confirmBtn');
  btn.disabled = true;

  try {
    // 1) 배지 얹은 화면 이미지를 휴대폰에 저장
    const ts = new Date().toISOString().replace(/[-:T.JZ]/g,'').slice(0,14);
    const label = badgeText || `${r_model.textContent} / ${r_deviceId.textContent}`;
    if (label.trim() !== '/') drawBadge(label, badgePos.x, badgePos.y);
    downloadCanvas(`scan_${ts}.jpg`);

    // 2) 인식값을 원드라이브 엑셀에 저장
    const res = await fetch(`${API_BASE}/save-result`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(ocrPreview)
    });
    const api = await res.json();

    if (res.ok && api.status === 'success') {
      alert('엑셀 저장 완료');
    } else if (api.write_error && api.write_error.error === 'no_access_token') {
      alert('엑셀 저장을 위해 먼저 로그인하세요.');
      window.location.href = `${API_BASE}/login`;
    } else {
      alert('저장 실패: ' + JSON.stringify(api));
    }
  } catch (e) {
    alert('서버 전송 실패: ' + e.message);
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
