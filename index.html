<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>유축기 출고 스캔</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#111827" />
  <style>
    body { font-family: system-ui,-apple-system,Segoe UI,Roboto; margin:0; padding:16px; background:#fff; color:#111827; }
    header { font-weight:700; font-size:18px; margin-bottom:12px; }
    .card { border:1px solid #e5e7eb; border-radius:12px; padding:16px; }
    button { padding:12px 16px; border-radius:10px; border:0; background:#111827; color:#fff; font-weight:600; }
    video, canvas { width:100%; border:1px solid #e5e7eb; border-radius:8px; }
    #preview, #snapshot { width:100%; aspect-ratio:16/7; object-fit:cover; }
  </style>
</head>
<body>
  <header>유축기 출고 스캔 (PWA)</header>

  <div class="card">
    <p>카메라 테스트</p>
    <video id="preview" autoplay playsinline muted></video>
    <br/><br/>
    <button id="captureBtn">사진 촬영</button>

    <canvas id="snapshot" style="display:none;margin-top:12px;"></canvas>
   <!-- OCR 결과 패널 -->
<div id="ocrPanel" style="display:none;margin-top:12px;">
  <div style="font-weight:600;margin-bottom:8px;">인식 결과 (확인 후 저장)</div>
  <div style="line-height:1.8">
    출고일: <span id="r_shipDate">-</span><br/>
    대여자명: <span id="r_name">-</span> / 전화: <span id="r_phone">-</span><br/>
    주소: <span id="r_addr">-</span><br/>
    기종: <span id="r_model">-</span> / 기기번호: <span id="r_deviceId">-</span><br/>
    송장번호: <span id="r_invoice">-</span>
  </div>
  <label style="display:block;margin:10px 0;">
    <input type="checkbox" id="ackChk"> 위 내용 확인함
  </label>
  <button id="confirmBtn" disabled>확인 (엑셀 저장)</button>
</div>

    <!-- OCR 결과 패널 -->
    <div id="ocrPanel" style="display:none;margin-top:12px;">
      <div style="font-weight:600;margin-bottom:8px;">인식 결과 (확인 후 저장)</div>
      <div style="line-height:1.8">
        출고일: <span id="r_shipDate">-</span><br/>
        대여자명: <span id="r_name">-</span> / 전화: <span id="r_phone">-</span><br/>
        주소: <span id="r_addr">-</span><br/>
        기종: <span id="r_model">-</span> / 기기번호: <span id="r_deviceId">-</span><br/>
        송장번호: <span id="r_invoice">-</span>
      </div>
      <label style="display:block;margin:10px 0;">
        <input type="checkbox" id="ackChk"/> 위 내용 확인함
      </label>
      <button id="confirmBtn" disabled>확인 (엑셀 저장)</button>
    </div>
  </div>

   <script>
const API_BASE = "https://rent-label-api-client-docker.onrender.com";

/* SW 등록 */
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); }

/* 요소 */
const video = document.getElementById('preview');
const canvas = document.getElementById('snapshot');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

/* 카메라(후면 우선) */
async function startCamera() {
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' }}, audio:false });
    video.srcObject = s; await video.play(); return;
  } catch {}
  const s = await navigator.mediaDevices.getUserMedia({ video:true, audio:false });
  video.srcObject = s; await video.play();
}
startCamera();

/* 캔버스 오버레이 */
function renderOverlayOnCanvas(r) {
  const pad = 16, boxH = 120;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, canvas.height - boxH, canvas.width, boxH);
  ctx.fillStyle = '#fff';
  ctx.font = '16px system-ui';
  [
    `기종: ${r.model || '미인식'} / 기기번호: ${r.deviceId || '미인식'}`,
    `수령인: ${r.name || '미인식'} / 전화: ${r.phone || '미인식'}`,
    `주소: ${r.addr || '미인식'} / 송장: ${r.invoice || '미인식'}`
  ].forEach((t,i)=>ctx.fillText(t, pad, canvas.height - boxH + pad + i*24));
}

/* 결과 패널 채우기 */
function populateResultPanel(r){
  document.getElementById('r_shipDate').textContent = r.shipDate || '-';
  document.getElementById('r_name').textContent     = r.name     || '-';
  document.getElementById('r_phone').textContent    = r.phone    || '-';
  document.getElementById('r_addr').textContent     = r.addr     || '-';
  document.getElementById('r_model').textContent    = r.model    || '-';
  document.getElementById('r_deviceId').textContent = r.deviceId || '-';
  document.getElementById('r_invoice').textContent  = r.invoice  || '-';
  document.getElementById('ocrPanel').style.display = 'block';
}

/* 촬영 → 캔버스에 그리기(가로 16:9 유지) + 임시표시 */
document.getElementById('captureBtn').addEventListener('click', () => {
  const w = video.videoWidth, h = video.videoHeight;
  if (!w || !h) return alert('카메라 초기화 대기 후 다시 시도');

  canvas.width = w; canvas.height = h;
  ctx.drawImage(video, 0, 0, w, h);
  canvas.style.display = 'block';

  // 서버 연결 전 임시값(빈표시) – UI가 사라지지 않도록
  const mock = { shipDate: new Date().toISOString().slice(0,10), name:'-', phone:'-', addr:'-', deviceId:'-', model:'-', invoice:'-' };
  renderOverlayOnCanvas(mock);
  populateResultPanel(mock);
});

/* 체크 → 버튼 활성화 */
document.getElementById('ackChk').addEventListener('change', (e)=>{
  document.getElementById('confirmBtn').disabled = !e.target.checked;
});

/* 확인 → 서버로 전송(OCR+엑셀) */
document.getElementById('confirmBtn').addEventListener('click', () => {
  if (document.getElementById('confirmBtn').disabled) return;

  canvas.toBlob(async (blob)=>{
    const fd = new FormData();
    fd.append('image', blob, 'capture.jpg');
    fd.append('qr_text', '');

    try{
      const res = await fetch(`${API_BASE}/process-ocr/`, { method:'POST', body:fd });
      const api = await res.json();

      const d = api.data || {};
      const mapped = {
        shipDate: d['출고일'] || '',
        name:     d['대여자명'] || '',
        phone:    d['전화번호'] || '',
        addr:     d['주소'] || '',
        deviceId: d['기기번호'] || '',
        model:    d['기종'] || '',
        invoice:  d['송장번호'] || ''
      };
      // 최신값 반영
      ctx.drawImage(canvas, 0, 0); // 배경 유지
      renderOverlayOnCanvas(mapped);
      populateResultPanel(mapped);

      alert(api.status === 'success' ? 'OCR 완료 및 엑셀 저장 성공' :
            'OCR 처리됨 (엑셀 저장 오류 가능): ' + JSON.stringify(api.write_error || {}));
    }catch(err){
      alert('서버 전송 실패: ' + err.message);
    }
  }, 'image/jpeg');
});
</script>
</body>
</html>
