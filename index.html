<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>유축기 출고 스캔 (PWA)</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#111827" />
  <style>
    :root { color-scheme: light dark; }
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Apple SD Gothic Neo,Noto Sans KR;margin:0;padding:16px;background:#fff;color:#111827}
    header{font-weight:800;font-size:22px;margin:4px 0 12px}
    .card{border:1px solid #e5e7eb;border-radius:12px;padding:16px}
    button{padding:12px 16px;border-radius:12px;border:0;background:#111827;color:#fff;font-weight:700}
    video,canvas{width:100%;border:1px solid #e5e7eb;border-radius:10px;background:#000}
    #preview,#snapshot{width:100%;aspect-ratio:16/7;object-fit:cover}
    #toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111827;color:#fff;
           padding:10px 14px;border-radius:10px;max-width:92%;font-size:13px;line-height:1.4;display:none;z-index:9999;white-space:pre-wrap}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>
  <header>카메라 테스트</header>

  <div class="card">
    <video id="preview" autoplay playsinline muted></video>
    <br/><br/>
    <button id="captureBtn">사진 촬영</button>

    <canvas id="snapshot" style="display:none;margin-top:12px;"></canvas>

    <div id="ocrPanel" style="display:none;margin-top:16px;">
      <div style="font-weight:800;margin-bottom:8px;">인식 결과 (확인 후 저장)</div>
      <div style="line-height:1.9">
        출고일: <span id="r_shipDate">-</span><br/>
        대여자명: <span id="r_name">-</span> / 전화번호: <span id="r_phone">-</span><br/>
        주소: <span id="r_addr">-</span><br/>
        기종: <span id="r_model">-</span> / 기기번호: <span id="r_deviceId">-</span>
      </div>
      <button id="confirmBtn" style="margin-top:12px;">확인 (엑셀 저장)</button>
    </div>
  </div>

  <div id="toast"></div>

<script>
const APP_VER  = "2025-08-27-09"; // 캐시버전

/* SW */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js?ver=' + APP_VER).catch(()=>{});
}

/* 토스트 */
const toastEl = document.getElementById('toast');
function toast(msg, ms=3000){
  try{
    if (typeof msg !== 'string') msg = JSON.stringify(msg, null, 2);
    toastEl.textContent = msg;
    toastEl.style.display = 'block';
    clearTimeout(toastEl.__t);
    toastEl.__t = setTimeout(()=>{ toastEl.style.display='none'; }, ms);
  }catch{}
}

/* 응답본문 안전 파서 */
async function readBodySafe(res){
  try { return await res.clone().json(); } catch {}
  try { return await res.clone().text(); } catch {}
  return null;
}

/* fetch (타임아웃 제거: AbortError 방지) */
async function fetchNoAbort(url, options={}){
  // credentials 포함 (세션 쿠키 유지)
  return await fetch(url, { credentials:'include', ...options });
}

/* 요소 */
const video   = document.getElementById('preview');
const canvas  = document.getElementById('snapshot');
const ctx     = canvas.getContext('2d', { willReadFrequently: true });

const r_shipDate = document.getElementById('r_shipDate');
const r_name     = document.getElementById('r_name');
const r_phone    = document.getElementById('r_phone');
const r_addr     = document.getElementById('r_addr');
const r_model    = document.getElementById('r_model');
const r_deviceId = document.getElementById('r_deviceId');

let badgeText = '';
let badgePos  = { x: 16, y: 16 };
let ocrPreview = null;
let ocrRunning = false;
let __stream = null;

/* QR → 기종/기기번호 */
function parseModelDevice(raw) {
  const original = (raw || '').toString().trim();
  const u = original.toUpperCase().replace(/[^A-Z0-9]/g,'');
  const MAP = { SM:'심포니', LT:'락티나', S:'스윙', M:'스윙맥스', F:'프리스타일', G:'각시밀', C:'시밀레' };
  const m2 = u.match(/^(SM|LT)(\d{2,})$/);
  if (m2) return { model: MAP[m2[1]] || '-', deviceId: m2[2], raw: original };
  const m1 = u.match(/^([SMFLGC])[A-Z0-9]*$/);
  if (m1)  return { model: MAP[m1[1]] || '-', deviceId: original, raw: original };
  return { model: '-', deviceId: original || '-', raw: original };
}

/* 배지 */
function drawBadge(text, x=16, y=16){
  if (!text) return;
  const padX = 14;
  ctx.font = 'bold 26px system-ui,-apple-system,Segoe UI,Roboto';
  const w = ctx.measureText(text).width + padX * 2;
  const h = 44;
  x = Math.max(8, Math.min(x, canvas.width  - w - 8));
  y = Math.max(8, Math.min(y, canvas.height - h - 8));
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#fff';
  ctx.fillText(text, x + padX, y + 30);
  badgePos = { x, y };
  badgeText = text;
}

/* 카메라 */
async function stopCamera(){
  try {
    if (video.srcObject) {
      video.srcObject.getTracks().forEach(t=>t.stop());
      video.srcObject = null;
    }
    if (__stream) {
      __stream.getTracks().forEach(t=>t.stop());
      __stream = null;
    }
  } catch(_) {}
}
async function initCamera(){
  await stopCamera();
  try {
    __stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ exact:'environment' }}, audio:false });
  } catch {
    try {
      __stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' }}, audio:false });
    } catch {
      __stream = await navigator.mediaDevices.getUserMedia({ video:true, audio:false });
    }
  }
  video.srcObject = __stream;
  await video.play().catch(()=>{});
}

/* 패널 — 한글 키 고정 */
function populatePanel(d){
  document.getElementById('ocrPanel').style.display = 'block';
  r_shipDate.textContent = d['출고일']   || '-';
  r_name.textContent     = d['대여자명'] || '-';
  r_phone.textContent    = d['전화번호'] || '-';
  r_addr.textContent     = d['주소']     || '-';
  r_model.textContent    = d['기종']     || '-';
  r_deviceId.textContent = d['기기번호'] || '-';
}

/* QR스캔 */
function scanQRFromCanvas() {
  try {
    const img = ctx.getImageData(0,0,canvas.width,canvas.height);
    const code = jsQR(img.data, img.width, img.height, { inversionAttempts:'attemptBoth' });
    return code ? { text: code.data, loc: code.location } : { text:'', loc:null };
  } catch { return { text:'', loc:null }; }
}

/* 압축(더 작게) */
function canvasToBlobResized(fromCanvas, cb) {
  const maxW = 800; // 더 작게
  const scale = Math.min(1, maxW / fromCanvas.width);
  if (scale < 1) {
    const tmp = document.createElement('canvas');
    tmp.width = Math.round(fromCanvas.width * scale);
    tmp.height = Math.round(fromCanvas.height * scale);
    tmp.getContext('2d', { willReadFrequently: true })
       .drawImage(fromCanvas, 0, 0, tmp.width, tmp.height);
    tmp.toBlob(cb, 'image/jpeg', 0.5);
  } else {
    fromCanvas.toBlob(cb, 'image/jpeg', 0.5);
  }
}

/* 시작 */
initCamera();

/* 이벤트 */
if (!window.__evtBound){
  window.__evtBound = true;

  document.getElementById('captureBtn').addEventListener('click', () => {
    const w = video.videoWidth, h = video.videoHeight;
    if (!w || !h) return alert('카메라 초기화 대기 후 다시 시도');

    canvas.width = w; canvas.height = h;
    ctx.drawImage(video, 0, 0, w, h);
    canvas.style.display = 'block';

    const base = {
      "출고일": new Date().toISOString().slice(0,10),
      "대여자명":"-", "전화번호":"-", "주소":"-",
      "기기번호":"-", "기종":"-"
    };

    const { text:qr, loc } = scanQRFromCanvas();
    if (qr) {
      const md = parseModelDevice(qr);
      base["기종"] = md.model;
      base["기기번호"] = md.deviceId;
      let bx = 16, by = 16;
      if (loc && loc.topLeftCorner) {
        bx = Math.max(16, loc.topLeftCorner.x - 8);
        by = Math.max(16, loc.topLeftCorner.y - 56);
      }
      drawBadge(`${base["기종"]} / ${base["기기번호"]}`, bx, by);
    } else {
      badgeText = ''; badgePos = { x:16, y:16 };
    }

    ocrPreview = base;
    populatePanel(ocrPreview);

    if (ocrRunning) return;
    ocrRunning = true;

    canvasToBlobResized(canvas, async (blob) => {
      // 프리뷰
      try{
        const fd = new FormData();
        fd.append('image', blob, 'p.jpg');
        fd.append('qr_text', (ocrPreview["기기번호"] || ''));
        const r = await fetchNoAbort(`/preview-ocr`, { method:'POST', body: fd });
        const body = await readBodySafe(r);
        if (!r.ok){ toast(`프리뷰 실패 ${r.status}\n${body ?? ''}`); }
        else{
          const j = (typeof body === 'string') ? {} : body;
          if (j && j.data){ ocrPreview = { ...ocrPreview, ...j.data }; populatePanel(ocrPreview); toast('프리뷰 수신'); }
          else { toast(`프리뷰 응답 비어있음\n${body ?? ''}`); }
        }
      }catch(e){ toast(`프리뷰 네트워크 오류\n${String(e)}`); }

      // 정식 OCR (기록 없음)
      try{
        const fd = new FormData();
        fd.append('image', blob, 'f.jpg');
        fd.append('qr_text', (ocrPreview["기기번호"] || ''));
        fd.append('no_write', 1);
        const r = await fetchNoAbort(`/process-ocr/`, { method:'POST', body: fd });
        const body = await readBodySafe(r);
        if (!r.ok){ toast(`정식 OCR 실패 ${r.status}\n${body ?? ''}`); }
        else{
          const j = (typeof body === 'string') ? {} : body;
          if (j && j.data){ ocrPreview = { ...ocrPreview, ...j.data }; populatePanel(ocrPreview); toast('정식 OCR 수신'); }
          else { toast(`정식 OCR 응답 비어있음\n${body ?? ''}`); }
        }
      }catch(e){ toast(`정식 OCR 네트워크 오류\n${String(e)}`); }

      ocrRunning = false;
    });
  });

  document.getElementById('confirmBtn').addEventListener('click', async () => {
    if (!ocrPreview) return alert('인식 결과가 없습니다. 먼저 촬영하세요.');
    const btn = document.getElementById('confirmBtn'); btn.disabled = true;

    // 사진 로컬 저장
    const label = `${ocrPreview["기종"] || '-'} / ${ocrPreview["기기번호"] || '-'}`;
    if (label.trim() !== '/ -') drawBadge(label, badgePos.x, badgePos.y);
    const ts = new Date().toISOString().replace(/[:.TZ]/g,'').slice(0,14);
    canvas.toBlob((b)=>{ try{
      const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `scan_${ts}.jpg`; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 10000);
    }catch{} }, 'image/jpeg', 0.7);

    // 서버 저장
    try{
      const res = await fetchNoAbort(`/save-result`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          "출고일":   ocrPreview["출고일"],
          "대여자명": ocrPreview["대여자명"],
          "전화번호": ocrPreview["전화번호"],
          "주소":     ocrPreview["주소"],
          "기기번호": ocrPreview["기기번호"],
          "기종":     ocrPreview["기종"],
        })
      });
      const body = await readBodySafe(res);
      if (res.ok){
        const j = (typeof body === 'string') ? {} : body;
        if (j.status === 'success') alert('엑셀 저장 완료');
        else alert('저장 실패: ' + (body ? (typeof body==='string'?body:JSON.stringify(body)) : '응답 없음'));
      } else if (res.status === 401){
        alert('엑셀 저장을 위해 로그인이 필요합니다.');
        location.href = `/login`;
      } else {
        alert('저장 실패: ' + (body ? (typeof body==='string'?body:JSON.stringify(body)) : res.status));
      }
    } catch(e){
      alert('서버 전송 실패: ' + (e?.message || e));
    } finally { btn.disabled = false; }
  });
}
</script>
</body>
</html>
