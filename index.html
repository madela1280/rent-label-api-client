<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>유축기 출고 스캔</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#111827" />
  <style>
    body { font-family: system-ui,-apple-system,Segoe UI,Roboto; margin:0; padding:16px; background:#fff; color:#111827; }
    header { font-weight:700; font-size:18px; margin-bottom:12px; }
    .card { border:1px solid #e5e7eb; border-radius:12px; padding:16px; }
    button { padding:12px 16px; border-radius:10px; border:0; background:#111827; color:#fff; font-weight:600; }
    video, canvas { width:100%; border:1px solid #e5e7eb; border-radius:8px; }
  </style>
</head>
<body>
  <header>유축기 출고 스캔 (PWA)</header>

  <div class="card">
    <p>카메라 테스트</p>
    <video id="preview" autoplay playsinline muted></video>
    <br/><br/>
    <button id="captureBtn">사진 촬영</button>

    <canvas id="snapshot" style="display:none;margin-top:12px;"></canvas>

    <!-- OCR 결과 패널 -->
    <div id="ocrPanel" style="display:none;margin-top:12px;">
      <div style="font-weight:600;margin-bottom:8px;">인식 결과 (확인 후 저장)</div>
      <div style="line-height:1.8">
        출고일: <span id="r_shipDate">-</span><br/>
        대여자명: <span id="r_name">-</span> / 전화: <span id="r_phone">-</span><br/>
        주소: <span id="r_addr">-</span><br/>
        기기번호: <span id="r_deviceId">-</span> / 기종: <span id="r_model">-</span><br/>
        송장번호: <span id="r_invoice">-</span>
      </div>
      <label style="display:block;margin:10px 0;">
        <input type="checkbox" id="ackChk"/> 위 내용 확인함
      </label>
      <button id="confirmBtn" disabled>확인 (엑셀 저장)</button>
    </div>
  </div>

  <script>
    // ===== 기본 설정 =====
    const API_BASE = "https://rent-label-api-client-docker.onrender.com";

    // 서비스워커 등록
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    // 요소 참조
    const videoEl     = document.getElementById('preview');
    const canvasEl    = document.getElementById('snapshot');
    const captureBtn  = document.getElementById('captureBtn');
    const confirmBtn  = document.getElementById('confirmBtn');
    const ackChk      = document.getElementById('ackChk');

    const r_shipDate  = document.getElementById('r_shipDate');
    const r_name      = document.getElementById('r_name');
    const r_phone     = document.getElementById('r_phone');
    const r_addr      = document.getElementById('r_addr');
    const r_deviceId  = document.getElementById('r_deviceId');
    const r_model     = document.getElementById('r_model');
    const r_invoice   = document.getElementById('r_invoice');

    // ===== 카메라 시작(후면 우선, 실패 시 대체) =====
    async function startCamera() {
      try {
        const s1 = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: 'environment' } }, audio: false
        });
        videoEl.srcObject = s1; await videoEl.play(); return;
      } catch {}
      try {
        const s2 = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } }, audio: false
        });
        videoEl.srcObject = s2; await videoEl.play(); return;
      } catch {}
      try {
        const s3 = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        videoEl.srcObject = s3; await videoEl.play(); return;
      } catch (err) {
        alert('카메라 접근 실패: ' + err);
      }
    }
    startCamera();

    // ===== 캡처 → 캔버스 표시 =====
    captureBtn.addEventListener('click', () => {
      const w = videoEl.videoWidth, h = videoEl.videoHeight;
      if (!w || !h) { alert('카메라 초기화 대기 후 다시 시도'); return; }
      const ctx = canvasEl.getContext('2d', { willReadFrequently: true });
      canvasEl.width = w; canvasEl.height = h;
      ctx.drawImage(videoEl, 0, 0, w, h);
      canvasEl.style.display = 'block';

      // 초기 표시(모의값) – 서버 OCR 연동 전 단계 확인 용
      const mock = {
        shipDate: new Date().toISOString().slice(0,10),
        name: '-', phone: '-', addr: '-',
        deviceId: '-', model: '-', invoice: '-'
      };
      renderOverlayOnCanvas(mock);
      populateResultPanel(mock);
    });

    // ===== 하단 오버레이 =====
    function renderOverlayOnCanvas(result) {
      const ctx = canvasEl.getContext('2d');
      const pad = 16, boxH = 120;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, canvasEl.height - boxH, canvasEl.width, boxH);
      ctx.fillStyle = '#fff';
      ctx.font = '16px system-ui';
      const lines = [
        `기기번호: ${result.deviceId || '미인식'} / 기종: ${result.model || '미인식'}`,
        `수령인: ${result.name || '미인식'} / 전화: ${result.phone || '미인식'}`,
        `주소: ${result.addr || '미인식'} / 송장: ${result.invoice || '미인식'}`
      ];
      lines.forEach((t, i) => ctx.fillText(t, pad, canvasEl.height - boxH + pad + i*24));
    }

    // ===== 결과 패널 채우기 =====
    function populateResultPanel(result) {
      r_shipDate.textContent = result.shipDate || '-';
      r_name.textContent     = result.name || '-';
      r_phone.textContent    = result.phone || '-';
      r_addr.textContent     = result.addr || '-';
      r_deviceId.textContent = result.deviceId || '-';
      r_model.textContent    = result.model || '-';
      r_invoice.textContent  = result.invoice || '-';
      document.getElementById('ocrPanel').style.display = 'block';
    }

    // 체크해야 저장 버튼 활성화
    ackChk.addEventListener('change', () => {
      confirmBtn.disabled = !ackChk.checked;
    });

    // ===== 확인 → 서버 업로드(OCR+엑셀) =====
    confirmBtn.addEventListener('click', async () => {
      if (canvasEl.style.display === 'none') { alert('캡처된 이미지가 없습니다.'); return; }
      canvasEl.toBlob(async (blob) => {
        const formData = new FormData();
        formData.append('image', blob, 'capture.jpg');
        formData.append('qr_text', ''); // 지금은 빈 값

        try {
          const res = await fetch(`${API_BASE}/process-ocr/`, { method:'POST', body: formData });
          if (!res.ok) throw new Error(`서버 응답 오류 (${res.status})`);
          const api = await res.json();

          // 응답 매핑
          const d = api.data || {};
          const mapped = {
            shipDate: d['출고일'] || '',
            name:     d['대여자명'] || '',
            phone:    d['전화번호'] || '',
            addr:     d['주소'] || '',
            deviceId: d['기기번호'] || '',
            model:    d['기종'] || '',
            invoice:  d['송장번호'] || ''
          };
          renderOverlayOnCanvas(mapped);
          populateResultPanel(mapped);

          if (api.status === 'success') {
            alert('OCR 완료 및 엑셀 저장 성공');
          } else {
            alert('OCR 처리됨 (엑셀 저장 오류 가능): ' + JSON.stringify(api.write_error || {}));
          }
        } catch (err) {
          alert('서버 전송 실패: ' + err.message);
        }
      }, 'image/jpeg');
    });
  </script>
</body>
</html>
